<style>
/* Layout: colonna singola da 760px, intestazione con conto alla rovescia, schede a tab, quiz a schermo intero della colonna */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#15202b; --muted:#5a6673; --line:#d9dfe5;
  --accent:#0b6e6a; --accent-ink:#ffffff; --accent-soft:#dff0ee;
  --good:#17803d; --good-soft:#e1f3e7; --bad:#b42318; --bad-soft:#fbe6e3; --warn:#9a5b00; --warn-soft:#fbefd5;
  --display:"IBM Plex Serif",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f161d; --surface:#18222c; --ink:#e8edf2; --muted:#98a6b3; --line:#2b3947;
    --accent:#4fc3bd; --accent-ink:#06211f; --accent-soft:#143634;
    --good:#58c27d; --good-soft:#12301f; --bad:#f08a80; --bad-soft:#3a1c19; --warn:#e8b25a; --warn-soft:#3a2c10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#18222c; --ink:#e8edf2; --muted:#98a6b3; --line:#2b3947;
  --accent:#4fc3bd; --accent-ink:#06211f; --accent-soft:#143634;
  --good:#58c27d; --good-soft:#12301f; --bad:#f08a80; --bad-soft:#3a1c19; --warn:#e8b25a; --warn-soft:#3a2c10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:16px}
h1{font-family:var(--display);font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.count{font-family:var(--mono);text-align:right}
.count b{font-size:1.9rem;display:block;line-height:1}
.count span{font-size:.78rem;color:var(--muted);font-family:var(--body)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
nav.tabs button{font:inherit;font-weight:500;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--display);font-size:1.15rem;margin:0 0 8px}
.card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,.field{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
label.inline{display:inline-flex;gap:8px;align-items:center}
.topic{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.topic:hover{border-color:var(--accent)}
.topic small{color:var(--muted);font-family:var(--mono)}
.group-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-family:var(--mono);font-size:.9rem}
.timer{font-weight:600;font-size:1.1rem}
.timer.low{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent)}
.qtext{font-family:var(--display);font-size:1.15rem;line-height:1.4;margin:6px 0 14px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt .k{font-family:var(--mono);font-weight:600;min-width:1.4em;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:12px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.95rem}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
.map{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.map button{font-family:var(--mono);font-size:.78rem;width:34px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;padding:0}
.map button.done{background:var(--accent-soft);border-color:var(--accent)}
.map button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.map button.cur{outline:2px solid var(--ink)}
.score{font-family:var(--mono);font-size:3rem;font-weight:600;line-height:1}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.table th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
details.rev{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
details.rev summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
details.rev .in{padding:0 12px 12px}
/* ripasso */
.sch ul{margin:6px 0 0;padding-left:20px}
.sch li{margin:4px 0}
.sch a{color:var(--accent)}
.note{font-size:.88rem;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
/* manuale e finestra di consultazione */
.btn.sm{padding:6px 11px;font-size:.85rem}
.man-tools{margin-bottom:10px}
.man-tools .field{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font:inherit;font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.read::after{content:" \2713";color:var(--good);font-weight:600}
.chip[aria-current="true"].read::after{color:inherit}
.hit{display:block;width:100%;text-align:left;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;margin-bottom:6px}
.hit:hover{border-color:var(--accent)}
.hit small{display:block;color:var(--muted);margin-top:2px;font-size:.84rem}
.man{line-height:1.6}
.man h3{font-family:var(--display);font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:22px 0 6px}
.man p{margin:8px 0}
.man ul,.man ol{padding-left:22px;margin:8px 0}
.man li{margin:4px 0}
.man a{color:var(--accent)}
.man code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.man .lead{font-size:1.02rem;color:var(--muted);margin:0 0 14px}
.man .key{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.man .ex{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.man .note{font-size:.88rem;color:var(--muted)}
.man .table{margin:8px 0;font-size:.85rem}
.man .table td,.man .table th{vertical-align:top;padding:6px 6px;hyphens:auto;overflow-wrap:break-word}
.man mark{background:var(--warn-soft);color:inherit;outline:1px solid var(--warn);border-radius:2px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.62);overflow:auto;padding:16px}
.sheet{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 18px 20px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);padding:12px 0;margin-bottom:6px;border-bottom:1px solid var(--line);z-index:1}
.expl .btn{margin-top:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>

  function drawProg(){
    var n=MAN.filter(function(s){return store.read[s.id];}).length;
    prog.textContent="Manuale di studio, "+MAN.length+" sezioni, aggiornato al 22 novembre 2026. Lette: "+n+" su "+MAN.length+".";
  }
  function drawChips(){
    chips.innerHTML="";
    MAN.forEach(function(s,i){
      chips.appendChild(el("button",{class:"chip"+(store.read[s.id]?" read":""),"aria-current":String(man.sec===s.id),title:s.t,text:(i+1)+" "+(CHIP[s.id]||shortT(s)),onclick:function(){man.sec=s.id;drawChips();drawSection(true);}}));
    });
  }
  function drawSection(scroll){
    body.innerHTML="";
    var s=secById(man.sec);if(!s)return;
    var w=qTerms(inp.value),i=MAN.indexOf(s);
    var sb=secBody(s,w);
    var card=el("div",{class:"card"},[el("h2",{text:s.t}),sb.node]);
    var pq=practiceFor(s);
    var row=el("div",{class:"row",style:"margin-top:16px"},[
      el("button",{class:"btn"+(store.read[s.id]?" ghost":""),text:store.read[s.id]?"Letta, tocca per togliere":"Segna come letta",onclick:function(){store.read[s.id]=!store.read[s.id];if(!store.read[s.id])delete store.read[s.id];save();drawProg();drawChips();drawSection(false);}}),
      pq?el("button",{class:"btn ghost",text:"Esercitati su questa sezione",onclick:function(){var q2=practiceFor(s);begin({mode:"topic",label:"Esercizi: "+shortT(s),qs:q2});}}):null
    ]);
    card.appendChild(row);
    card.appendChild(el("div",{class:"nav"},[
      el("button",{class:"btn ghost",text:"Sezione precedente",disabled:i===0?"":null,onclick:function(){man.sec=MAN[i-1].id;drawChips();drawSection(true);}}),
      el("button",{class:"btn ghost",text:"Sezione successiva",disabled:i===MAN.length-1?"":null,onclick:function(){man.sec=MAN[i+1].id;drawChips();drawSection(true);}})
    ]));
    [].forEach.call(card.querySelectorAll("button"),function(b){if(b.getAttribute("disabled")===null)b.removeAttribute("disabled");});
    body.appendChild(card);
    if(scroll){var tgt=sb.first||body;if(tgt.scrollIntoView)tgt.scrollIntoView({block:sb.first?"center":"start"});}
  }
  function update(){
    var w=qTerms(inp.value);res.innerHTML="";
    if(w.length){
      var hits=MAN.map(function(s){return {s:s,c:secScore(s,w)};}).filter(function(h){return h.c>0;}).sort(function(a,b){return b.c-a.c;});
      var term="«"+inp.value.trim()+"»";
      res.appendChild(el("p",{class:"note",text:hits.length?hits.length+(hits.length===1?" sezione contiene ":" sezioni contengono ")+term+". Tocca un risultato per aprirlo con i termini evidenziati.":"Nessun risultato per "+term+"."}));
      hits.forEach(function(h){
        res.appendChild(el("button",{class:"hit",onclick:function(){man.sec=h.s.id;drawChips();drawSection(true);}},[el("strong",{text:shortT(h.s)+" ("+h.c+")"}),el("small",{text:snippet(h.s,w)})]));
      });
    }
    man.q=inp.value;
    drawSection(false);
  }
  inp.addEventListener("input",update);
  v.appendChild(prog);
  v.appendChild(el("div",{class:"man-tools"},[inp]));
  v.appendChild(chips);v.appendChild(res);v.appendChild(body);
  drawProg();drawChips();update();
}

/* ───────── motore quiz ───────── */
function begin(cfg){
  run={mode:cfg.mode,label:cfg.label,penalty:!!cfg.penalty,idx:0,done:false,
    items:cfg.qs.map(function(q){return {q:q,order:shuffle([0,1,2,3]),sel:null,flag:false,shown:false};}),
    limit:cfg.limit||0,endAt:cfg.limit?Date.now()+cfg.limit*1000:0};
  if(run.limit){stopTimer();timer=setInterval(tick,500);}
  render();
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function tick(){
  if(!run||run.done){stopTimer();return;}
  var left=Math.round((run.endAt-Date.now())/1000);
  var t=$("#timer"); if(t){t.textContent=fmt(left);t.classList.toggle("low",left<=300);}
  if(left<=0)finish();
}
function renderRun(v){
  var it=run.items[run.idx], q=it.q, n=run.items.length, sim=run.mode==="sim";
  var head=el("div",{class:"qhead"},[
    el("span",{text:run.label+" · "+(run.idx+1)+"/"+n}),
    sim?el("span",{class:"timer",id:"timer",text:fmt(Math.round((run.endAt-Date.now())/1000))}):el("span",{class:"pill",text:TOPICS[q.t].l})
  ]);
  var card=el("div",{class:"card"},[head,el("div",{class:"bar"},[el("i",{style:"width:"+Math.round((run.idx+1)/n*100)+"%"})]),el("div",{class:"qtext",text:q.q})]);
  var opts=el("div",{class:"opts",role:"group","aria-label":"Risposte"});
  it.order.forEach(function(oi,pos){
    var b=el("button",{class:"opt","aria-pressed":String(it.sel===oi),onclick:function(){answer(oi);}},[el("span",{class:"k",text:LETTERS[pos]}),el("span",{text:q.o[oi]})]);
    if(!sim&&it.shown){b.disabled=true;if(oi===0)b.classList.add("ok");else if(it.sel===oi)b.classList.add("ko");}
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if(!sim&&it.shown){
    var ex=el("div",{class:"expl"},[el("strong",{text:it.sel===0?"Corretto. ":"Non è questa. "}),document.createTextNode(q.e)]);
    var mb=manualButton(q.t);
    if(mb)ex.appendChild(el("div",null,[mb]));
    card.appendChild(ex);
  }
  var nav=el("div",{class:"nav"});
  if(sim){
    nav.appendChild(el("div",{class:"row"},[
      el("button",{class:"btn ghost",text:"Indietro",disabled:run.idx===0?"":null,onclick:function(){go(run.idx-1);}}),
      el("button",{class:"btn ghost",text:it.flag?"Togli segnalazione":"Segnala da rivedere",onclick:function(){it.flag=!it.flag;render();}}),
      el("button",{class:"btn ghost",text:"Avanti",disabled:run.idx===n-1?"":null,onclick:function(){go(run.idx+1);}})
    ]));
    nav.appendChild(el("button",{class:"btn danger",text:"Consegna",onclick:function(){confirmFinish(card);}}));
  }else{
    nav.appendChild(el("button",{class:"btn ghost",text:"Esci",onclick:function(){stopTimer();run=null;render();}}));
    nav.appendChild(el("button",{class:"btn",text:run.idx===n-1?"Vedi risultato":"Avanti",disabled:it.shown?null:"",onclick:function(){if(run.idx===n-1)finish();else go(run.idx+1);}}));
  }
  // disabled="" attribute removal when null
  [].forEach.call(nav.querySelectorAll("button"),function(b){if(b.getAttribute("disabled")===null)b.removeAttribute("disabled");});
  card.appendChild(nav);
  v.appendChild(card);
  if(sim){
    var map=el("div",{class:"map",role:"group","aria-label":"Elenco quesiti"});
    run.items.forEach(function(x,i){
      var b=el("button",{text:String(i+1),"aria-label":"Vai al quesito "+(i+1),onclick:function(){go(i);}});
      if(x.sel!==null)b.classList.add("done");
      if(x.flag)b.classList.add("flag");
      if(i===run.idx)b.classList.add("cur");
      map.appendChild(b);
    });
    v.appendChild(map);
    var un=run.items.filter(function(x){return x.sel===null;}).length;
    v.appendChild(el("p",{class:"note",text:un+" senza risposta, "+run.items.filter(function(x){return x.flag;}).length+" segnalati."}));
  }
}
function go(i){run.idx=Math.max(0,Math.min(run.items.length-1,i));render();}
function answer(oi){
  var it=run.items[run.idx];
  if(run.mode==="sim"){it.sel=(it.sel===oi)?null:oi;render();return;}
  if(it.shown)return;
  it.sel=oi;it.shown=true;
  if(!it.q.gen){
    markSeen(it.q);
    if(oi===0){delete store.wrong[it.q.id];}else{store.wrong[it.q.id]=(store.wrong[it.q.id]||0)+1;}
  }
  save();render();
}
function confirmFinish(card){
  if($("#cf"))return;
  var un=run.items.filter(function(x){return x.sel===null;}).length;
  var box=el("div",{class:"expl",id:"cf",style:"border-left-color:var(--bad);background:var(--bad-soft)"},[
    el("p",{text:un?("Hai "+un+" quesiti senza risposta. Consegnare adesso?"):"Consegnare la simulazione?"}),
    el("div",{class:"row"},[el("button",{class:"btn danger",text:"Sì, consegna",onclick:finish}),el("button",{class:"btn ghost",text:"Continua",onclick:function(){box.remove();}})])
  ]);
  card.appendChild(box);
}
function finish(){
  if(!run||run.done)return;
  stopTimer(); run.done=true;
  run.items.forEach(function(it){
    var wasRight=it.sel===0;
    if(run.mode==="sim"&&!it.q.gen){
      if(it.sel!==null){ markSeen(it.q); if(wasRight)delete store.wrong[it.q.id]; else store.wrong[it.q.id]=(store.wrong[it.q.id]||0)+1; }
    }
  });
  if(run.mode==="sim"){
    var r=calc();
    var now=new Date();
    store.hist.push({d:now.getDate()+"/"+(now.getMonth()+1),m:run.label+(run.penalty?" −0,25":""),n:run.items.length,s:r.score});
    if(store.hist.length>40)store.hist=store.hist.slice(-40);
  }
  save(); render();
}
function calc(){
  var right=0,wrong=0,blank=0;
  run.items.forEach(function(it){if(it.sel===null)blank++;else if(it.sel===0)right++;else wrong++;});
  var pts=right-(run.penalty?wrong*0.25:0);
  var score=Math.max(0,pts/run.items.length*100);
  return {right:right,wrong:wrong,blank:blank,pts:pts,score:score};
}

/* ───────── risultato ───────── */
function renderResult(v){
  var n=run.items.length;
  if(run.mode!=="sim"){
    var ok=run.items.filter(function(i){return i.sel===0;}).length;
    v.appendChild(el("div",{class:"card"},[el("h2",{text:run.label}),el("div",{class:"score",text:ok+"/"+n}),el("p",{text:"risposte corrette, "+pct(ok/n*100)+"%"}),
      el("div",{class:"row"},[el("button",{class:"btn",text:"Torna all'elenco",onclick:function(){run=null;render();}})])]));
    return;
  }
  var r=calc(), passed=r.score>=70;
  var left=Math.max(0,Math.round((run.endAt-Date.now())/1000));
  var c=el("div",{class:"card"},[
    el("h2",{text:"Esito simulazione"}),
    el("div",{class:"row",style:"align-items:baseline"},[el("div",{class:"score",text:pct(r.score)}),el("span",{text:"/100"}),el("span",{class:"pill "+(passed?"good":"bad"),text:passed?"Sopra la soglia di 70":"Sotto la soglia di 70"})]),
    el("p",{text:r.right+" corrette, "+r.wrong+" errate, "+r.blank+" senza risposta"+(run.penalty?". Punti netti: "+pct(r.pts)+" su "+n+".":".")}),
    el("p",{class:"note",text:"Tempo residuo alla consegna: "+fmt(left)+"."})
  ]);
  // per argomento
  var by={};
  run.items.forEach(function(it){var t=it.q.t;by[t]=by[t]||{n:0,ok:0};by[t].n++;if(it.sel===0)by[t].ok++;});
  var rows=Object.keys(by).sort(function(a,b){return by[a].ok/by[a].n-by[b].ok/by[b].n;}).map(function(k){
    var p=by[k].ok/by[k].n*100;
    return el("tr",null,[el("td",{text:TOPICS[k].l}),el("td",{text:by[k].ok+"/"+by[k].n}),el("td",null,[el("span",{class:"pill "+(p>=70?"good":p>=50?"warn":"bad"),text:pct(p)+"%"})])]);
  });
  c.appendChild(el("h3",{text:"Per argomento, dal più debole"}));
  c.appendChild(el("div",{class:"scroll"},[el("table",{class:"table"},[el("thead",null,[el("tr",null,[el("th",{text:"Argomento"}),el("th",{text:"Corrette"}),el("th",{text:"Resa"})])]),el("tbody",null,rows)])]));
  var wrongItems=run.items.filter(function(i){return i.sel!==0;});
  var weakSecs=[];
  Object.keys(by).filter(function(k){return by[k].ok/by[k].n<0.7;}).sort(function(a,b){return by[a].ok/by[a].n-by[b].ok/by[b].n;}).forEach(function(k){var sid=TOPIC_SEC[k];if(sid&&weakSecs.indexOf(sid)<0&&weakSecs.length<4)weakSecs.push(sid);});
  if(weakSecs.length){
    c.appendChild(el("h3",{text:"Da ripassare nel manuale"}));
    c.appendChild(el("div",{class:"row"},weakSecs.map(function(sid){return el("button",{class:"btn ghost sm",text:shortT(secById(sid)),onclick:function(ev){openManual(sid,ev.currentTarget);}});})));
  }
  c.appendChild(el("div",{class:"row",style:"margin-top:14px"},[
    el("button",{class:"btn",text:"Nuova simulazione",onclick:function(){run=null;cur="sim";render();}}),
    wrongItems.length?el("button",{class:"btn ghost",text:"Rifai i "+wrongItems.length+" quesiti non corretti",onclick:function(){begin({mode:"err",label:"Errori della simulazione",qs:shuffle(wrongItems.map(function(i){return i.q;}))});}}):null
  ]));
  v.appendChild(c);
  v.appendChild(el("div",{class:"group-title",text:"Correzione dei quesiti non corretti"}));
  if(!wrongItems.length)v.appendChild(el("div",{class:"empty",text:"Tutto corretto."}));
  wrongItems.forEach(function(it){
    var idx=run.items.indexOf(it)+1;
    var det=el("details",{class:"rev"});
    det.appendChild(el("summary",null,[el("span",{class:"pill "+(it.sel===null?"warn":"bad"),text:"#"+idx+(it.sel===null?" vuota":" errata")}),el("span",{text:it.q.q.length>110?it.q.q.slice(0,110)+"…":it.q.q})]));
    var inn=el("div",{class:"in"},[
      el("p",{style:"white-space:pre-line",text:it.q.q}),
      el("p",null,[el("strong",{text:"Risposta corretta: "}),document.createTextNode(it.q.o[0])]),
      it.sel!==null?el("p",null,[el("strong",{text:"La tua risposta: "}),document.createTextNode(it.q.o[it.sel])]):null,
      el("div",{class:"expl"},[document.createTextNode(it.q.e),manualButton(it.q.t)?el("div",null,[manualButton(it.q.t)]):null])
    ]);
    det.appendChild(inn);
    v.appendChild(det);
  });
}

render();
})();
</script>
